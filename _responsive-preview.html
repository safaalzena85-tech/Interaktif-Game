<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Pratinjau Responsif — Quiz Show Pro</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0b1226; color:#e8eefc; font-family:system-ui,sans-serif; padding:16px; }
  h1 { font-size:16px; margin:0 0 4px; }
  p.note { margin:0 0 14px; font-size:12px; color:#9fb0d0; }
  .row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .dev { background:#1b2436; border:1px solid #2b3550; border-radius:12px; padding:10px; }
  .dev > b { display:block; font-size:12px; margin-bottom:8px; color:#9fb0d0; }
  iframe { border:0; border-radius:8px; background:#070b17; display:block; }
</style>
</head>
<body>
  <h1>Pratinjau responsif Quiz Show Pro</h1>
  <p class="note">Tiap iframe = satu perangkat. Halaman ini memerlukan server LAN aktif (<code>node server.js 5173</code>).</p>
  <div class="row">
    <div class="dev"><b>HP 390×740 — KONTROL</b><iframe src="http://localhost:5173/index.html" width="390" height="740"></iframe></div>
    <div class="dev"><b>Tablet 820×1180 — KONTROL</b><iframe src="http://localhost:5173/index.html" width="820" height="1180"></iframe></div>
    <div class="dev"><b>HP landscape 844×390 — KONTROL</b><iframe src="http://localhost:5173/index.html" width="844" height="390"></iframe></div>
    <div class="dev"><b>HP 390×740 — TAMPILAN</b><iframe src="http://localhost:5173/display.html" width="390" height="740"></iframe></div>
    <div class="dev"><b>Desktop 1350×644 — TAMPILAN</b><iframe src="http://localhost:5173/display.html?room=48C7" width="1350" height="644"></iframe></div>
    <div class="dev"><b>Desktop 1366×768 — TAMPILAN</b><iframe src="http://localhost:5173/display.html?room=48C7" width="1366" height="768"></iframe></div>
  </div>
</body>
</html>
